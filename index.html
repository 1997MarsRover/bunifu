    {

      "mainEntity": [
        {
          "@type": "Question",
          "name": "What age groups do you cater to?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We work with children aged 6-17 years old, with programs tailored to different age groups and skill levels. Our younger learners (6-10) focus on foundational concepts through play, while older students (11-17) engage in more advanced projects and competitions."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need any prior experience in STEM?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No prior experience is required! Our programs are designed for beginners and we guide each student at their own pace. We believe every child has the potential to be an innovator."
          }
        },
        {
          "@type": "Question",
          "name": "What equipment do students need?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "All necessary equipment is provided at our center. Students just need to bring their enthusiasm and curiosity! For some advanced programs, we may recommend a personal laptop, but this is optional."
          }
        },
        {
          "@type": "Question",
          "name": "How can parents/guardians get involved?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We encourage parental involvement! Parents can volunteer as mentors, attend our showcase events, participate in parent-child workshops, or support our programs through sponsorships and partnerships."
          }
        },
        {
          "@type": "Question",
          "name": "Are there any scholarships available?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! We offer scholarships for students from underserved communities. Our mission is to make STEM education accessible to all young Kenyans regardless of their financial background. Contact us to learn more about our scholarship programs."
          }
        },
        {
          "@type": "Question",
          "name": "What makes Bunifu different from other STEM programs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Bunifu combines hands-on learning with African innovation stories and mentorship from industry professionals. We focus not just on technical skills, but also on creativity, problem-solving, and entrepreneurship to help students become well-rounded innovators."
          }
        }
      ]
